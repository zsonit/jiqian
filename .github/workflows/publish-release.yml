name: publish-release

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download APK artifact
        run: |
          gh api repos/${{ github.repository }}/actions/runs/41014073673/artifacts > art.json
          URL=$(python3 -c "import json;print(json.load(open('art.json'))['artifacts'][0]['archive_download_url'])")
          gh api "$URL" > art.zip
          unzip -o art.zip
          mv app-debug.apk JiQian-android.apk || true

      - name: Upload assets to release v4.0
        run: |
          gh release upload v4.1 JiQian-android.apk --clobber -R ${{ github.repository }}
