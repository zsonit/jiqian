name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JiQian
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project JiQian.xcodeproj \
            -scheme JiQian \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/JiQian.app"
          test -d "$APP" || { echo "build output missing"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JiQian-unsigned.ipa Payload
          ls -lh JiQian-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: JiQian-unsigned-ipa
          path: JiQian-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JiQian-unsigned.ipa
