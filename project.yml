name: JiQian
options:
  bundleIdPrefix: com.jiqian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO

targets:
  JiQian:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JiQian
    info:
      path: JiQian/Info.plist
      properties:
        CFBundleDisplayName: 胎动记录
        CFBundleName: JiQian
        CFBundleShortVersionString: "5.13"
        CFBundleVersion: "61"
        CFBundleURLTypes:
          - CFBundleURLName: com.jiqian.app
            CFBundleURLSchemes:
              - jiqian
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - zh-Hans
          - en
    dependencies:
      - target: JiQianWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiqian.app
        PRODUCT_NAME: JiQian
        MARKETING_VERSION: "5.13"
        CURRENT_PROJECT_VERSION: "61"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false

  # 锁屏 / 桌面组件：两个可点的开关（胎动、宫缩）
  JiQianWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 胎动组件
        CFBundleShortVersionString: "5.13"
        CFBundleVersion: "61"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiqian.app.widgets
        PRODUCT_NAME: JiQianWidgets
        MARKETING_VERSION: "5.13"
        CURRENT_PROJECT_VERSION: "61"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: NO
